name: Rider AI Android build

on:
  push:
    paths:
      - "android-rider-ai/**"
      - ".github/workflows/android-rider-ai.yml"
  pull_request:
    paths:
      - "android-rider-ai/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-rider-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rider-ai-debug-apk
          path: android-rider-ai/app/build/outputs/apk/debug/*.apk
