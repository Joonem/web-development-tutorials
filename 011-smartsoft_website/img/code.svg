<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#0b1324"/><g font-family="monospace" font-size="13"><text x="20" y="36" fill="#7dd3fc">const</text><text x="70" y="36" fill="#e2e8f0">line = await plc.connect();</text><text x="20" y="62" fill="#c084fc">if</text><text x="42" y="62" fill="#e2e8f0">(sensor.status === </text><text x="196" y="62" fill="#fbbf24">'OK'</text><text x="232" y="62" fill="#e2e8f0">) {</text><text x="40" y="88" fill="#e2e8f0">conveyor.</text><text x="112" y="88" fill="#4ade80">start</text><text x="152" y="88" fill="#e2e8f0">({ speed: </text><text x="230" y="88" fill="#F26B1D">1.2</text><text x="256" y="88" fill="#e2e8f0">});</text><text x="40" y="114" fill="#e2e8f0">vision.</text><text x="96" y="114" fill="#4ade80">inspect</text><text x="152" y="114" fill="#e2e8f0">(frame);</text><text x="20" y="140" fill="#e2e8f0">}</text><text x="20" y="166" fill="#64748b">// log production data</text><text x="20" y="192" fill="#e2e8f0">db.</text><text x="44" y="192" fill="#4ade80">save</text><text x="78" y="192" fill="#e2e8f0">(report);</text><text x="20" y="218" fill="#c084fc">export default</text><text x="132" y="218" fill="#e2e8f0">line;</text></g></svg>
