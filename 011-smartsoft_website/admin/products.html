<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Manage Products | SMARTSOFT Admin</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <aside class="side"><a href="../index.html" class="side__brand"><img src="../img/logo.svg" alt="">SMARTSOFT</a><div class="side__title">Admin Dashboard</div><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a><a href="products.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Products</a><a href="dashboard.html#inquiries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>Inquiries</a><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7"/></svg>Users</a><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a><a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>Logout</a></aside>
  <div class="main">
    <div class="top"><button class="menu-btn" aria-label="Menu">&#9776;</button><h1>Manage Products</h1><span class="muted">&#128276;</span></div>
    <section class="panel">
      <div class="panel__head"><h2>All Products</h2><button class="btn" id="addProduct">+ Add Product</button></div>
      <table><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="productRows"></tbody></table>
    </section>
    <dialog id="productDialog">
      <form method="dialog" id="productForm">
        <h3 id="dialogTitle">Add Product</h3>
        <label>Name<input name="name" required></label>
        <label>Category<select name="category"><option>PLC &amp; Control</option><option>Vision System</option><option>Barcode &amp; Label</option><option>Software</option></select></label>
        <label>Image<select name="image"><option value="plc.svg">PLC</option><option value="camera.svg">Camera</option><option value="printer.svg">Printer</option><option value="laptop.svg">Laptop / Software</option><option value="factory.svg">Factory</option></select></label>
        <label>Status<select name="status"><option>Published</option><option>Draft</option></select></label>
        <div class="dialog__actions"><button type="button" class="btn btn--ghost" id="cancelDialog">Cancel</button><button class="btn" value="save">Save</button></div>
      </form>
    </dialog>
    <footer>&copy; <span data-year>2026</span> Smartsoft Trading Enterprise</footer>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
